<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Code-along Activity | Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML and CSS Quiz</h1>

    <form>
        <label for="question1"><span class="q-number">1.</span> What does the acronym CSS stand
            for?</label>
        <input type="text" name="q1" id="q1" required><br>

        <label for="question2"><span class="q-number">2.</span> How are id and class attributes
            selected in CCS?</label>
        <textarea name="q2" id="q2" rows="4" required></textarea><br>

        <label for="question3"><span class="q-number">3.</span> Which of the following is a valid
            CSS comment?</label>
        <select name="q3" id="q3" required>
            <option value="" selected disabled>Choose One...</option>
            <option value="html">&lt;!-- font size: larger;--&gt;</option>
            <option value="css">/* font size: smaller; */</option>
            <option value="js">// font size: smaller;</option>
        </select><br>

        <label for="question4"><span class="q-number">4.</span> What is the bottom margin given this
            declaration?<br> <code> margin:
            10px 5px 15px</code><br></label>
        <input type="number" name="q4" id="q4" required><br>

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
