<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information:</legend>
                <div class="form-item column 2">
                    <label for="fullname">Fullname:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column 2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions:</legend>
                <div class="form-item column1">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="1">Chrome</option>
                        <option value="2">Safari</option>
                        <option value="3">Edge</option>
                        <option value="4">Brave</option>
                        <option value="5">Other</option>
                    </select>
                </div>

                <div class="form-item column1">
                    <label for="pet">Do you have a household pet? <input type="checkbox" id="pet"
                          name="pet"></label>
                </div>

                <div class="form-item">
                    <label for="feedback">List the places you've lived:</label>
                    <textarea name="feedback" id="feedback" rows="4"
                      placeholder="Luzon, Visayas, Mindanao"></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy;2026 | HTML Form-User Poll Activity | Sherriza Sempio</p>
    </footer>
</body>

</html>
