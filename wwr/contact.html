<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting Travel</title>
    <meta name="description"
      content="The website provides the rafting company’s contact information, including its location, phone numbers, emails, and a contact form for sending messages.">
    <meta name="author" content="Sherriza Kirsten Sempio">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-travel-logo.jpg" alt="Rafting Travel Logo">
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>


    <main>
        <div class="contact-info">
            <h1>Rafting Travel Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 123 456 7890</p>
            <p><a href="mailto:">raftingtravel@gmail.com</a></p>
        </div>

        <div class="contact-container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d88531.6051638866!2d-114.3366064454781!3d34.45023228400727!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1790775214948!5m2!1sen!2sph"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form>
                <div class="userinfo">
                    <label for="nameuser">Name </label>
                    <input type="text" name="nameuser" id="nameuser" placeholder="name here">
                </div>

                <div class="userinfo">
                    <label for="useremail">Email </label>
                    <input type="email" name="useremail" id="useremail"
                      placeholder="james@example.com">
                </div>

                <div class="mes-purpose">
                    <table>
                        <tr>
                            <td rowspan="3">
                                <label for="purpose">Message Purpose</label>
                            </td>
                            <td>
                                <label>
                                    <input type="radio" name="purpose" id="inquiry">
                                    General Inquiry
                                </label>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    <input type="radio" name="purpose" id="reserve">
                                    Reservation Queston
                                </label>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    <input type="radio" name="purpose" id="suggestion">
                                    Website Suggestion
                                </label>
                            </td>
                        </tr>
                    </table>
                </div>

                <label for="message">Message <textarea name="message" id="message" rows="4"
                      placeholder="Type your message here..."></textarea></label>

                <label for="subscribe">
                    <input type="checkbox" name="subscribe" id="subscribe"> Please subscribe me
                    to
                    the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>
        </div>

        <section>
            <div class="employees">
                <h2>Adventure Awaits You!</h2>
                <figure>
                    <img src="images/office-staff.jpg" alt="Picture of the Head Office Staff">
                    <figcaption>Office Staff</figcaption>
                </figure>
                <figure>
                    <img src="images/op-manager.jpg" alt="Picture of the Operations Manager">
                    <figcaption>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/travel-guider.jpg" alt="Picture of the Head travel guive">
                    <figcaption>River Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>


    <footer>
        <p>&copy;2026 🚣 Rafting Travel 🚣 Sherriza Sempio</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/">
                <img src="images/instagram-square.svg" alt="Instagram Icon" width="55"></a>
            <a href="https://facebook.com"> <img src="images/facebook-icon.svg" alt="Facebook Icon"
                  width="50"></a>
            <a href="https://www.linkedin.com/"><img src="images/linkedin-square.svg"
                  alt="LinkedIn Icon" width="50"></a>
        </nav>
    </footer>
</body>

</html>
